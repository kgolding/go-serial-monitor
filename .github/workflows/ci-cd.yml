# Main workflow for testing and releasing
# spellchecker: disable

name: CI/CD

env:
  GOVERSION: "1.23"
  NAME: "go-serial-monitor"
  FULLNAME: "Serial Monitor"
  FULLNAME2: "Serial_Monitor" # for AppImage file, e.g. with spaces replaced by underscores
  VERSION: "0.0.0"

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc libgl1-mesa-dev xorg-dev

      - name: Install dependencies
        run: go mod download

      # - name: Test
      #   run: go test -coverprofile=coverage.txt ./...

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}

  package_linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc libgl1-mesa-dev xorg-dev libfuse2 libwayland-dev libxkbcommon-dev

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Package Fyne app
        run: |
          export CFLAGS="-Wno-error=cpp"
          fyne package -os linux --release --tags migrated_fynedo
          mv "${{ env.FULLNAME }}.tar.xz" "${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz"

      - name: Inspect
        run: ls -R

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-linux
          path: ${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz
          if-no-files-found: error
          overwrite: true

  package_deb:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, package_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.NAME }}-linux

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: Build .deb package
        run: |
          set -e
          pkgroot="pkgroot/${{ env.NAME }}"
          mkdir -p "$pkgroot/DEBIAN" "$pkgroot/usr/bin" "$pkgroot/usr/share/applications" "$pkgroot/usr/share/pixmaps"

          # fyne package's tar.xz (built by package_linux) installs under
          # usr/local/ - move its contents to the usr/ paths a .deb should
          # use instead.
          mkdir extracted
          tar xf "${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz" -C extracted --strip-components=1
          cp extracted/usr/local/bin/* "$pkgroot/usr/bin/"
          cp extracted/usr/local/share/applications/*.desktop "$pkgroot/usr/share/applications/"
          cp extracted/usr/local/share/pixmaps/*.png "$pkgroot/usr/share/pixmaps/"
          chmod 755 "$pkgroot/usr/bin/"*

          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: ${{ env.NAME }}
          Version: ${{ env.VERSION }}
          Section: electronics
          Priority: optional
          Architecture: amd64
          Maintainer: Kevin Golding <kevin@kgolding.co.uk>
          Homepage: https://github.com/kgolding/go-serial-monitor
          Description: ${{ env.FULLNAME }}
           Connect to a serial port, monitor RX/TX in ASCII and hex, and send ASCII or hex data.
          EOF

          dpkg-deb --build --root-owner-group "$pkgroot" "${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.deb"

      - name: Lint package
        run: dpkg-deb --info "${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-deb
          path: ${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.deb
          if-no-files-found: error
          overwrite: true

