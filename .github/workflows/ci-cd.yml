  package_windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install Dependencies
        run: >
          pacman -Syu &&
          pacman --noconfirm -S git zip mingw-w64-x86_64-toolchain

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package
        run: fyne package -os windows --release --tags migrated_fynedo

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          echo "VERSION=${VERSION:1}" >> $GITHUB_ENV

      - name: ZIP package
        run: zip ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip "${{ env.FULLNAME }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-windows
          path: ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  package_windows_signed:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package_windows
    runs-on: windows-latest
    environment: release # fixed OIDC subject (repo:OWNER/REPO:environment:release) so Azure's federated credential doesn't need to match a different tag name every release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.NAME }}-windows

      - name: Set version
        run: |
          $version = "${{ github.ref_name }}"
          "VERSION=$($version.Substring(1))" >> $env:GITHUB_ENV

      - name: Unzip
        run: Expand-Archive -Path "${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip" -DestinationPath extracted

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign exe
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: kgolding-codesign
          certificate-profile-name: serial-monitor-signing
          files-folder: ${{ github.workspace }}\extracted
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Re-zip signed package
        run: Compress-Archive -Path "extracted\${{ env.FULLNAME }}.exe" -DestinationPath "${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-windows
          path: ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error
          overwrite: true

